# One-time import: copies this project's files from my live Vercel sites into the repo and commits them.
# It only downloads files (curl) and runs `git commit`; nothing downloaded is executed.
# README/.gitignore come from gh-import-kit.vercel.app; everything else from the project's own live site.
# Safe to delete this file after the first run.
name: Import project files
on:
  push:
    paths: [".github/workflows/import.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files from the live sites
        shell: bash
        run: |
          set -euo pipefail
          K=https://gh-import-kit.vercel.app/lagos-in-layers
          P=https://progress-akpan-portfolio.vercel.app
          U=$P/projects/urban-heat-island-lagos
          L=https://lagos-in-layers-1.vercel.app
          LEAF="leaflet.css leaflet.js LICENSE images/layers-2x.png images/layers.png images/marker-icon-2x.png images/marker-icon.png images/marker-shadow.png"
          get(){ mkdir -p "$(dirname "$2")"; curl -fsSL --retry 4 --retry-delay 3 "$1" -o "$2"; echo "ok $2"; }
          get $K/README.md README.md
          get $K/gitignore.txt .gitignore
          get $K/vercel-json.txt vercel.json
          for f in EDITING.md LICENSE app.js index.html intro.js preview.jpg styles.css pipeline/build2.py pipeline/clip.py pipeline/epoch.py pipeline/graph.py pipeline/mly_dl.py pipeline/mly_match.py pipeline/ovt.py pipeline/samp.py pipeline/stories.json data/config.json data/graph.json data/land.wasm data/layers.json data/mly.json data/overview.wasm data/periods.json data/photos.json data/quests.json data/search.json data/water.wasm; do get $L/$f $f; done
          CH="c10_2 c10_3 c10_4 c10_5"
          for x in 11 12 13 15 16 17 18 19 20 22 23 24 25 26 27 28; do for y in 2 3 4 5 6 7; do CH="$CH c${x}_$y"; done; done
          CH="$CH c14_1 c14_2 c14_3 c14_4 c14_5 c14_6 c14_7 c1_1 c1_2 c21_2 c21_3 c21_4 c21_6 c21_7 c29_2 c29_3 c2_1 c2_2 c30_1 c30_2 c30_3 c30_4 c30_5 c31_1 c31_2 c31_3 c31_4 c31_5 c32_1 c32_2 c33_1 c33_2 c34_1 c3_1 c3_2 c4_1 c4_2 c4_3 c5_1 c5_2 c5_3 c5_4 c6_1 c6_2 c6_3 c6_4 c7_1 c7_2 c7_3 c7_4 c8_1 c8_2 c8_3 c9_1 c9_2 c9_3 c9_4"
          for c in $CH; do get $L/data/chunks/$c.wasm data/chunks/$c.wasm; done
          for p in m10_3 m11_3 m11_4 m12_3 m12_5 m12_6 m13_2 m13_3 m13_4 m13_5 m13_6 m13_7 m14_2 m14_3 m14_4 m14_5 m14_6 m15_2 m15_3 m15_5 m15_6 m16_2 m16_3 m16_5 m16_6 m16_7 m17_2 m17_5 m17_6 m17_7 m18_3 m18_4 m18_5 m18_6 m18_7 m19_3 m19_6 m1_1 m20_7 m21_3 m22_3 m23_3 m26_5 m4_2 m5_2 m6_3 m7_3 m8_3 m9_3; do get $L/data/photos/$p.wasm data/photos/$p.wasm; done
          echo "chunks: $(ls data/chunks | wc -l) photos: $(ls data/photos | wc -l)"
      - name: Commit
        shell: bash
        run: |
          git config user.name "Progress Peter Akpan"
          git config user.email "357548878+Progress-peter@users.noreply.github.com"
          git add -A
          printf '%s\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_016mDH8SNRmcV7Z2q514LUHT\n' "Add Lagos in Layers 3D map, data pipeline and README" | git commit -q -F -
          git push origin HEAD:main
          echo "FILES: $(git ls-files | wc -l)"
